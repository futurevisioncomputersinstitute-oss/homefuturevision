<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Sora, 'Segoe UI', Arial, sans-serif">
  <title>How a Power BI report refreshes itself</title>
  <desc>Your data (Excel files, databases, websites) flows into Power BI, where you clean and connect it once. It becomes a dashboard with charts and filters that is shared online. Each week the report refreshes from the source, so you refresh it instead of rebuilding it.</desc>

  <!-- node 1: your data -->
  <rect x="16" y="24" width="180" height="176" rx="18" fill="#f4f8fd" stroke="#dde6f2"/>
  <rect x="94" y="48" width="44" height="42" rx="6" fill="#e3f4ec" stroke="#128263" stroke-width="3"/>
  <path d="M102 62 h28 M102 72 h28 M102 82 h18" stroke="#128263" stroke-width="3" stroke-linecap="round"/>
  <text x="106" y="128" text-anchor="middle" font-size="23" font-weight="800" fill="#0f2747">Your data</text>
  <text x="106" y="154" text-anchor="middle" font-size="16" fill="#44546b">Excel files, databases,</text>
  <text x="106" y="175" text-anchor="middle" font-size="16" fill="#44546b">websites</text>

  <!-- node 2: Power BI -->
  <rect x="230" y="24" width="180" height="176" rx="18" fill="#f4f8fd" stroke="#dde6f2"/>
  <path d="M296 50 h48 l-18 24 v22 l-12 -8 v-14 z" fill="#fdf3d4" stroke="#c98f00" stroke-width="3" stroke-linejoin="round" transform="translate(-1 0)"/>
  <text x="320" y="128" text-anchor="middle" font-size="23" font-weight="800" fill="#0f2747">Power BI</text>
  <text x="320" y="154" text-anchor="middle" font-size="16" fill="#44546b">Clean and connect</text>
  <text x="320" y="175" text-anchor="middle" font-size="16" fill="#44546b">it once</text>

  <!-- node 3: dashboard -->
  <rect x="444" y="24" width="180" height="176" rx="18" fill="#f4f8fd" stroke="#dde6f2"/>
  <rect x="504" y="68" width="14" height="24" rx="3" fill="#2a5fa0"/>
  <rect x="524" y="52" width="14" height="40" rx="3" fill="#2a5fa0"/>
  <rect x="544" y="60" width="14" height="32" rx="3" fill="#f2b01e"/>
  <text x="534" y="128" text-anchor="middle" font-size="23" font-weight="800" fill="#0f2747">Dashboard</text>
  <text x="534" y="154" text-anchor="middle" font-size="16" fill="#44546b">Charts, filters,</text>
  <text x="534" y="175" text-anchor="middle" font-size="16" fill="#44546b">shared online</text>

  <!-- arrows -->
  <path d="M200 112 h22 m-8 -8 l8 8 l-8 8" stroke="#163d6d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 112 h22 m-8 -8 l8 8 l-8 8" stroke="#163d6d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- refresh loop -->
  <path d="M534 206 C534 322 106 322 106 218" fill="none" stroke="#128263" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>
  <polygon points="106,204 97,222 115,222" fill="#128263"/>
  <text x="320" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#128263">Refresh, don’t rebuild.</text>
</svg>
