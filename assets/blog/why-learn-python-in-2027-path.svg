<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Sora, 'Segoe UI', Arial, sans-serif">
  <title>The Python learning staircase</title>
  <desc>A three-step staircase. Step one: basics and small scripts. Step two: data and files. Step three: web apps and AI.</desc>

  <rect x="16" y="168" width="192" height="116" rx="16" fill="#e3f4ec" stroke="#cfe8dc"/>
  <rect x="224" y="108" width="192" height="176" rx="16" fill="#e8f0fa" stroke="#d3e1f3"/>
  <rect x="432" y="48" width="192" height="236" rx="16" fill="#fdf3d4" stroke="#f3e4ae"/>

  <circle cx="44" cy="196" r="17" fill="#128263"/><text x="44" y="203" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text>
  <circle cx="252" cy="136" r="17" fill="#2a5fa0"/><text x="252" y="143" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text>
  <circle cx="460" cy="76" r="17" fill="#c98f00"/><text x="460" y="83" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text>

  <text x="112" y="244" text-anchor="middle" font-size="25" font-weight="800" fill="#0f2747">Basics</text>
  <text x="112" y="268" text-anchor="middle" font-size="17" fill="#44546b">small scripts</text>

  <text x="320" y="204" text-anchor="middle" font-size="25" font-weight="800" fill="#0f2747">Data</text>
  <text x="320" y="228" text-anchor="middle" font-size="17" fill="#44546b">files and charts</text>

  <text x="528" y="164" text-anchor="middle" font-size="25" font-weight="800" fill="#0f2747">Apps + AI</text>
  <text x="528" y="188" text-anchor="middle" font-size="17" fill="#44546b">web, chatbots</text>

  <path d="M70 150 C 200 150, 330 90, 548 28" fill="none" stroke="#163d6d" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round"/>
  <polygon points="560,22 540,20 546,38" fill="#163d6d"/>
</svg>
