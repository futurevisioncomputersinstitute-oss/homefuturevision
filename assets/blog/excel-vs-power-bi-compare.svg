<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Sora, 'Segoe UI', Arial, sans-serif">
  <title>Excel and Power BI side by side</title>
  <desc>Excel is for working things out: calculating, cleaning and exploring data in a grid. Power BI is for showing the result: reports and dashboards that refresh and can be shared.</desc>

  <!-- Excel panel -->
  <rect x="16" y="16" width="272" height="300" rx="20" fill="#f4f8fd" stroke="#dde6f2"/>
  <rect x="34" y="34" width="104" height="34" rx="17" fill="#128263"/>
  <text x="86" y="57" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">EXCEL</text>
  <rect x="34" y="82" width="236" height="32" rx="8" fill="#ffffff" stroke="#dde6f2"/>
  <text x="46" y="104" font-size="17" fill="#128263" font-family="Consolas, 'Courier New', monospace">=SUM(B2:B4)</text>
  <g stroke="#dde6f2" stroke-width="1.5">
    <rect x="34" y="126" width="59" height="30" fill="#e3f4ec"/><rect x="93" y="126" width="59" height="30" fill="#e3f4ec"/><rect x="152" y="126" width="59" height="30" fill="#e3f4ec"/><rect x="211" y="126" width="59" height="30" fill="#e3f4ec"/>
    <rect x="34" y="156" width="59" height="30" fill="#fff"/><rect x="93" y="156" width="59" height="30" fill="#fff"/><rect x="152" y="156" width="59" height="30" fill="#fff"/><rect x="211" y="156" width="59" height="30" fill="#fff"/>
    <rect x="34" y="186" width="59" height="30" fill="#fff"/><rect x="93" y="186" width="59" height="30" fill="#fff"/><rect x="152" y="186" width="59" height="30" fill="#fff"/><rect x="211" y="186" width="59" height="30" fill="#fff"/>
    <rect x="34" y="216" width="59" height="30" fill="#fff"/><rect x="93" y="216" width="59" height="30" fill="#fff"/><rect x="152" y="216" width="59" height="30" fill="#fff"/><rect x="211" y="216" width="59" height="30" fill="#e3f4ec"/>
  </g>
  <g font-size="14" fill="#44546b">
    <text x="42" y="146">Item</text><text x="101" y="146">Jan</text><text x="160" y="146">Feb</text><text x="219" y="146">Total</text>
    <text x="42" y="176">Shirt</text><text x="101" y="176">120</text><text x="160" y="176">140</text><text x="219" y="176">260</text>
    <text x="42" y="206">Saree</text><text x="101" y="206">90</text><text x="160" y="206">110</text><text x="219" y="206">200</text>
    <text x="42" y="236">Sum</text><text x="219" y="236" font-weight="700" fill="#128263">460</text>
  </g>
  <text x="152" y="288" text-anchor="middle" font-size="27" font-weight="800" fill="#0f2747">Work it out</text>

  <!-- arrow -->
  <circle cx="320" cy="166" r="22" fill="#163d6d"/>
  <path d="M310 166 h19 m-7 -8 l8 8 l-8 8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="210" text-anchor="middle" font-size="16" font-weight="600" fill="#44546b">then</text>

  <!-- Power BI panel -->
  <rect x="352" y="16" width="272" height="300" rx="20" fill="#f4f8fd" stroke="#dde6f2"/>
  <rect x="370" y="34" width="124" height="34" rx="17" fill="#f2b01e"/>
  <text x="432" y="57" text-anchor="middle" font-size="18" font-weight="700" fill="#0f2747" letter-spacing="1">POWER BI</text>
  <rect x="370" y="82" width="236" height="164" rx="12" fill="#ffffff" stroke="#dde6f2"/>
  <g>
    <rect x="388" y="196" width="24" height="36" rx="4" fill="#2a5fa0"/>
    <rect x="422" y="168" width="24" height="64" rx="4" fill="#2a5fa0"/>
    <rect x="456" y="184" width="24" height="48" rx="4" fill="#2a5fa0"/>
    <rect x="490" y="136" width="24" height="96" rx="4" fill="#f2b01e"/>
  </g>
  <circle cx="560" cy="130" r="28" fill="none" stroke="#e8f0fa" stroke-width="14"/>
  <circle cx="560" cy="130" r="28" fill="none" stroke="#163d6d" stroke-width="14" stroke-dasharray="108 176" transform="rotate(-90 560 130)"/>
  <circle cx="560" cy="130" r="28" fill="none" stroke="#f2b01e" stroke-width="14" stroke-dasharray="34 176" stroke-dashoffset="-108" transform="rotate(-90 560 130)"/>
  <polyline points="530,214 546,200 562,208 580,186 596,192" fill="none" stroke="#128263" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="488" y="288" text-anchor="middle" font-size="27" font-weight="800" fill="#0f2747">Show it</text>

  <!-- captions -->
  <text x="152" y="352" text-anchor="middle" font-size="18" fill="#44546b">Calculate · clean · explore</text>
  <text x="488" y="352" text-anchor="middle" font-size="18" fill="#44546b">Report · refresh · share</text>
</svg>
