# GitHub Pages (Jekyll) skips files that start with a dot unless they are
# listed here. The page-builder runtime requests this sidecar on every load;
# without it the browser logs a 404 error in the console.
include:
  - .image-slots.state.json

# Unpublished from the live site; files are kept in the repo.
exclude:
  - basic-graphic-designing
  - graphic-foundations
  - advanced-graphic-designing
  - advanced-design-advertisement
  - cinematic-reels-ai-invites
